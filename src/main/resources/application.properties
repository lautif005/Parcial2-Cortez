# ----------------------------------------------------
# CONFIGURACIÓN GENERAL
# ----------------------------------------------------
# CRÍTICO PARA RENDER: Usa la variable de entorno $PORT si está disponible,
# sino usa 8080 (para desarrollo local).
server.port=${PORT:8080} 
spring.application.name=mutant-detector-api

# Habilitar el logging del sistema de caché (Útil para pruebas de caché)
logging.level.org.springframework.cache=DEBUG

# ----------------------------------------------------
# CONFIGURACIÓN DE BASE DE DATOS H2 (en memoria para desarrollo)
# ----------------------------------------------------
# La URL de conexión al inicio de la app: jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console          

# ----------------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# ----------------------------------------------------
# Muestra las consultas SQL generadas en la consola
spring.jpa.show-sql=true
# Crea automáticamente el esquema de la BD al iniciar (hibernate.ddl-auto)
spring.jpa.hibernate.ddl-auto=create-drop
# Dialecto de H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ----------------------------------------------------
# CONFIGURACIÓN DE CACHÉ (Optimización clave)
# Usando caché simple en memoria (ConcurrentMapCacheManager)
# ----------------------------------------------------
spring.cache.type=simple

# ----------------------------------------------------
# CONFIGURACIÓN DE SWAGGER/OPENAPI (Documentación API)
# ----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html

# ----------------------------------------------------
# CONFIGURACIÓN DE LOGGING (opcional, pero útil)
# ----------------------------------------------------
logging.level.org.springframework=INFO
logging.level.org.example=DEBUG